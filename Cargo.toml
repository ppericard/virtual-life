[package]
name = "virtual-life"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A reproducible synchronous population experiment for VirtualLife"
license-file = "LICENSE"
default-run = "headless"

[features]
default = []
web = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio", "dep:serde_json", "dep:serde", "dep:getrandom"]

[dependencies]
getrandom = { version = "0.4.3", optional = true }
hyper = { version = "1.10", optional = true, features = ["http1", "server"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }
http-body-util = { version = "0.1", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "time", "signal", "macros", "sync", "io-util"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[[bin]]
name = "web"
path = "src/bin/web.rs"
required-features = ["web"]
