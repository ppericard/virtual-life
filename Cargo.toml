[package]
name = "virtual-life"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A scripted synchronous grid demonstrator for VirtualLife"
license-file = "LICENSE"
default-run = "headless"

[features]
default = []
viewer = ["dep:eframe"]

[dependencies]
eframe = { version = "=0.36.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"
required-features = ["viewer"]
