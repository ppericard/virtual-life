[package]
name = "virtual-life"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A minimal multi-agent laboratory for emergent behavior"
license = "GPL-3.0-only"

[features]
default = []
viewer = ["dep:eframe"]

[dependencies]
rand = "0.10.2"
eframe = { version = "0.36.1", optional = true }

[[bin]]
name = "virtual-life"
path = "src/bin/run.rs"

[[bin]]
name = "virtual-life-viewer"
path = "src/bin/view.rs"
required-features = ["viewer"]
