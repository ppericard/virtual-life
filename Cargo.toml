[package]
name = "virtual-life"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A scripted synchronous grid demonstrator for VirtualLife"
license-file = "LICENSE"
default-run = "headless"

[features]
default = []
viewer = ["dep:eframe"]
web = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio", "dep:serde_json", "dep:serde"]

[dependencies]
eframe = { version = "=0.36.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
hyper = { version = "1.10", optional = true, features = ["http1", "server"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }
http-body-util = { version = "0.1", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "time", "signal", "macros", "sync"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"
required-features = ["viewer"]

[[bin]]
name = "web"
path = "src/bin/web.rs"
required-features = ["web"]
