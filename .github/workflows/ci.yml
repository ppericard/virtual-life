name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test core
        run: cargo test > cargo-test.log 2>&1
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-log
          path: cargo-test.log
      - name: Check viewer
        run: cargo check --features viewer --bin virtual-life-viewer > cargo-viewer.log 2>&1
      - name: Upload viewer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-viewer-log
          path: cargo-viewer.log
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo fmt --check
